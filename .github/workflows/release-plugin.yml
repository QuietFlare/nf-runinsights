# Releases the Nextflow plugin to the plugin registry (registry.nextflow.io)
# on every plugin-v* tag. Needs the NPR_API_KEY repository secret (create an API key
# at registry.nextflow.io, then add it under Settings > Secrets > Actions).
name: release plugin to Nextflow registry

on:
  push:
    tags: ["plugin-v*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Check tag matches build.gradle version
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#plugin-v}"
          version=$(sed -n "s/^version = '\(.*\)'/\1/p" build.gradle)
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match build.gradle version $version" >&2
            exit 1
          fi

      - name: Run tests
        run: ./gradlew test

      - name: Release to registry
        env:
          NPR_API_KEY: ${{ secrets.NPR_API_KEY }}
        run: ./gradlew releasePluginToRegistryIfNotExists
