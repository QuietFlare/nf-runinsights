# Releases the Python readers (dashboard + MCP server) to PyPI on every
# pypi-v* tag: nf-runinsights, plus the nf-runinsights-dashboard shim from
# packaging/. Trusted publishing, no token secret. One-time setup on
# pypi.org under "Publishing", once per project (a pending publisher
# before the first release): repository QuietFlare/nf-runinsights,
# workflow release-pypi.yml, environment pypi. One minted token covers
# every project that lists this publisher.
name: release dashboard to PyPI

on:
  push:
    tags: ["pypi-v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag matches both pyproject.toml versions
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#pypi-v}"
          for f in pyproject.toml packaging/nf-runinsights-dashboard/pyproject.toml; do
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' "$f")
            if [ "$tag" != "$version" ]; then
              echo "tag v$tag does not match $f version $version" >&2
              exit 1
            fi
          done

      - name: Build sdists and wheels
        run: |
          python -m pip install build
          python -m build
          python -m build packaging/nf-runinsights-dashboard -o dist

      - name: Smoke-test the wheels
        run: |
          python -m pip install --no-index --find-links dist dist/*.whl
          nf-runinsights-mcp --selftest
          nf-runinsights --help

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # OIDC for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
